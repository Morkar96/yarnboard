name: Security

# Dedicated security gate, separate from ci.yml's general test run (which
# already picks up tests/test_security.py and the SSRF-guard tests in
# tests/test_scraper.py too, since it runs the whole suite). This
# workflow exists to make the security-relevant checks individually
# visible in the Actions UI/PR checks list, and to add dependency
# vulnerability scanning that ci.yml doesn't do.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-disclosed CVE in an unchanged dependency still
    # gets caught even with no code pushed that week.
    - cron: "0 6 * * 1"

jobs:
  backend-security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Regression tests for the manual security-audit findings: SSRF /
      # local-file-read via the pattern-URL scraper, the SECRET_KEY
      # production fail-loud check, password strength, the login timing
      # side-channel, rate limiting, and HTML-escaping in outbound emails.
      - run: pytest tests/test_security.py tests/test_scraper.py -v

  backend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit
      # Scans the exact pinned versions in requirements.txt against the
      # PyPA advisory database. Fails the job on any known vulnerability.
      - run: pip-audit -r requirements.txt

  frontend-dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # audit-level=high (not the npm default of "low"): react-router-dom
      # currently carries two known *moderate* advisories (open redirect
      # via a backslash in <Link>/useNavigate, and an SSR-hydration issue
      # that doesn't apply here since this app has no SSR) that would
      # require an accepted major-version migration (v6 -> v7) to clear.
      # Tracked as a known, accepted risk rather than blocking every PR on
      # it; this still fails the build on anything high or critical.
      - run: npm audit --omit=dev --audit-level=high
