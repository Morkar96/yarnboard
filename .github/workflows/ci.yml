name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run test

  build-check:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Mirrors render.yaml's buildCommand exactly, so a broken production
      # build is caught here rather than at deploy time. Keep in sync with
      # that file if it ever changes.
      - run: cd backend && pip install -r requirements.txt && cd ../frontend && npm install && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    env:
      DATABASE_URL: sqlite:///e2e.db
      FLASK_ENV: development
      CORS_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:5001
      # Explicitly blank, not just unset -- see Makefile's `e2e` target for
      # why this matters for notifications.spec.ts's deterministic
      # log-fallback assertion.
      RESEND_ONBOARDING: ""
      RESEND_NOTIFICATIONS: ""
      RESEND_NEWSLETTER: ""
      GEMINI_API_KEY: ""
      # frontend/e2e/fixtures.ts's readVerifyToken defaults to
      # backend/.venv/bin/flask (local dev, see Makefile) -- there's no
      # venv here, pip installs straight into the runner's system Python
      # and `flask` ends up directly on PATH.
      E2E_FLASK_BIN: flask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: flask --app wsgi seed-e2e
        working-directory: backend
      - name: Start backend
        run: nohup flask --app wsgi run --port 5001 > ../backend.log 2>&1 &
        working-directory: backend
      - name: Start frontend
        run: nohup npm run dev > ../frontend.log 2>&1 &
        working-directory: frontend
      - name: Wait for servers
        run: npx wait-on http://localhost:5001/api/health http://localhost:5173 --timeout 60000
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7
